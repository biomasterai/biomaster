<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BioMaster / Responsive check</title><link rel="stylesheet" href="./tokens.css"><style>body{margin:0;background:#e7e8e2;font:14px var(--bm-font-sans);color:#181a18}header{padding:16px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}select,a{color:inherit;min-height:40px}select{padding:8px;border:1px solid #858c7a;border-radius:4px;background:#fff}main{padding:0 20px 20px;overflow:auto}iframe{display:block;width:390px;height:844px;border:1px solid #858c7a;background:#f7f7f2;box-sizing:content-box}label{display:flex;gap:10px;align-items:center}span{font-size:12px;color:#51564b}</style></head>
<body><header><b>BioMaster · 响应式验收</b><label>CSS 视口 <select id="size"><option value="320">320 × 800</option><option value="390" selected>390 × 844</option><option value="768">768 × 1024</option><option value="1280">1280 × 900</option></select></label><span>内嵌真实手册，固定 CSS 宽度，不受外层浏览器缩放影响。</span><a href="./index.html">打开完整手册 ↗</a></header><main><iframe src="./index.html" title="BioMaster 视觉规范响应式预览" id="preview"></iframe></main><script>
document.getElementById("size").addEventListener("change",event=>{
const frame=document.getElementById("preview");
frame.style.width=event.target.value+"px";
frame.style.height=({"320":800,"390":844,"768":1024,"1280":900})[event.target.value]+"px";
});
</script></body></html>
